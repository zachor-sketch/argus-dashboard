name: ARGUS Challenger Phase A
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: challenger-phase-a-${{ github.ref }}
  cancel-in-progress: false
jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check && npm test
      - name: Verify history against event base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            node scripts/challenger-guard.mjs "$BASE"
          else
            node scripts/challenger-guard.mjs HEAD
          fi
      - name: Architecture only; no live scoring or persistence
        run: node scripts/challenger-run.mjs
      - name: Replay controlled pilot provenance and independent-before-debate history
        run: node scripts/challenger-pilot.mjs verify
      - name: Verify isolated discovery registry, provenance and evidence completion
        run: node scripts/challenger-b1.mjs verify
      - name: Replay Phase C underwriting calculations, PIT inputs and frozen debate
        run: node scripts/challenger-c.mjs verify
      - name: Assert no tracked or untracked writes
        run: test -z "$(git status --porcelain)"
